[project]
name = "af-watch"
version = "0.1.0"
description = "Weekly expert-grade OSS contribution briefing across the agent framework ecosystem."
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "PyGithub>=2.5.0,<3",
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
    "pydantic>=2,<3",
    "rich>=13.7.1,<16.0.0",
]
# Note: no anthropic / agent-framework deps. LLM calls go through `claude` CLI subprocess.

[project.scripts]
af-watch = "af_watch.cli:main"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-timeout==2.4.0",
    "ruff==0.15.8",
    "mypy==1.20.0",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/af_watch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 120
addopts = "-ra -q -m 'not e2e'"
markers = [
    "e2e: end-to-end tests requiring real LLM, network; skipped by default",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "RUF", "SIM", "RET"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
strict = true
python_version = "3.12"
