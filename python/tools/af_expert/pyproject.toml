[project]
name = "af-expert"
version = "0.1.0"
description = "Continuously-learning domain expert for OSS agent framework contributions"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "pygithub>=2.5.0",
    "pydantic>=2.10.0",
    "click>=8.1.7",
"platformdirs>=4.3.0",
]

[project.scripts]
af-expert = "af_expert.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/af_expert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests requiring real network + API keys (manual run only)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
