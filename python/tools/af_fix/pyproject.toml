[project]
name = "af-fix"
version = "0.1.0"
description = "Triage and fix open-source issues via Claude Code SDK."
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "PyGithub>=2.5.0,<3",
    "pydantic>=2,<3",
    "rich>=13.7.1,<16.0.0",
    "claude-agent-sdk>=0.2.82",
]

[project.scripts]
af-fix = "af_fix.cli:main"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-timeout==2.4.0",
    "ruff==0.15.8",
    "mypy==1.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/af_fix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 120
addopts = "-ra -q -m 'not e2e'"
markers = [
    "e2e: end-to-end tests requiring real LLM, Docker; skipped by default",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "RUF", "SIM", "RET"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
strict = true
python_version = "3.12"
